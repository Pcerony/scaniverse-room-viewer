<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f7f5" />
    <meta name="description" content="3D空間のウォークスルーと目線の高さの調整" />
    <link rel="icon" href="data:," />
    <title>3Dビューア</title>
  </head>
  <body>
    <main id="app" data-mode="walk" aria-label="3Dビューア">
      <div id="viewport" aria-label="3D空間" tabindex="0"></div>
      <header class="topbar">
        <nav class="mode-switch" aria-label="表示モード">
          <button id="walk" aria-pressed="true">
            <i data-lucide="footprints"></i><span>ウォーク</span>
          </button>
          <button id="overview" aria-pressed="false">
            <i data-lucide="box"></i><span>全体表示</span>
          </button>
        </nav>
        <div class="tools">
          <button id="help" class="icon-button" title="操作ガイド" aria-label="操作ガイド"><i data-lucide="circle-help"></i></button>
          <button
            id="reset"
            class="icon-button"
            title="開始位置に戻る"
            aria-label="開始位置に戻る"
          >
            <i data-lucide="locate-fixed"></i>
          </button>
          <button
            id="lock"
            class="icon-button desktop-only"
            title="マウス視点を固定 · Escで解除"
            aria-label="マウス視点を固定"
            aria-pressed="false"
          >
            <i data-lucide="mouse-pointer-2"></i>
          </button>
          <button
            id="fullscreen"
            class="icon-button"
            title="全画面表示"
            aria-label="全画面表示"
            aria-pressed="false"
          >
            <i data-lucide="maximize"></i>
          </button>
        </div>
      </header>

      <div class="crosshair" aria-hidden="true"></div>
      <section class="height-panel" aria-label="目線の高さ">
        <button
          id="height-toggle"
          class="height-heading"
          aria-expanded="true"
          aria-controls="height-body"
        >
          <span><i data-lucide="ruler"></i>目線の高さ</span
          ><span
            ><output id="height-value">1.65 <small>m</small></output
            ><i data-lucide="chevron-down" class="chevron"></i
          ></span>
        </button>
        <div id="height-body">
          <div
            id="presets"
            class="presets"
            role="group"
            aria-label="目線の高さのプリセット"
          ></div>
          <div class="height-range">
            <input
              id="height"
              type="range"
              min="0.60"
              max="2.10"
              step="0.01"
              value="1.65"
              aria-label="目線の高さ（m）"
            />
            <div class="range-labels">
              <span>0.60 m</span><span>2.10 m</span>
            </div>
          </div>
        </div>
      </section>

      <div id="joystick" class="joystick" role="group" aria-label="移動スティック">
        <div class="joystick-ring">
          <i data-lucide="chevron-up" class="north"></i
          ><i data-lucide="chevron-right" class="east"></i
          ><i data-lucide="chevron-down" class="south"></i
          ><i data-lucide="chevron-left" class="west"></i>
          <div id="stick" class="stick"></div>
        </div>
      </div>
      <div id="toast" class="toast" role="status" hidden></div>

      <dialog id="tutorial" aria-labelledby="tutorial-title">
        <div class="tutorial-content">
          <p class="tutorial-eyebrow">GUIDE</p>
          <h2 id="tutorial-title">操作ガイド</h2>
          <div class="tutorial-tabs" role="group" aria-label="デバイスを選択">
            <button id="guide-desktop" aria-pressed="true">パソコン</button>
            <button id="guide-mobile" aria-pressed="false">スマートフォン</button>
          </div>
          <div id="desktop-guide" class="guide-list">
            <div><span class="guide-icon"><i data-lucide="keyboard"></i></span><p><strong>移動</strong><span><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> または方向キーで前後左右に移動</span></p></div>
            <div><span class="guide-icon"><i data-lucide="mouse"></i></span><p><strong>見回す</strong><span>画面をマウスでドラッグして視点を変更</span></p></div>
          </div>
          <div id="mobile-guide" class="guide-list" hidden>
            <div><span class="guide-icon"><i data-lucide="move"></i></span><p><strong>移動</strong><span>左下のスティックを動かして前後左右に移動</span></p></div>
            <div><span class="guide-icon"><i data-lucide="hand"></i></span><p><strong>見回す</strong><span>画面をドラッグして視点を変更。移動と同時に操作できます</span></p></div>
          </div>
          <div class="guide-common"><i data-lucide="ruler"></i><span>目線の高さを調整できます。全体表示や開始位置へのリセットも利用できます。</span></div>
          <button id="start-guide" class="start-guide">はじめる <i data-lucide="arrow-right"></i></button>
        </div>
      </dialog>

      <div
        id="loading"
        class="loading-overlay"
        role="status"
        aria-live="polite"
      >
        <div class="loading-content">
          <div class="loading-mark"><i data-lucide="scan"></i></div>
          <h2 id="loading-title">読み込み中</h2>
          <p id="loading-detail">モデルとテクスチャをダウンロードしています</p>
          <output id="progress-value">0%</output>
          <div class="progress-track" id="load-progress" role="progressbar" aria-label="読み込みの進行状況" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress"></div></div>
          <button id="retry" hidden>
            <i data-lucide="rotate-cw"></i>再読み込み
          </button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
